version: "3.9"
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tmeet
      POSTGRES_PASSWORD: tmeet_dev_password
      POSTGRES_DB: tmeet
    ports:
      - "5433:5432"
    volumes:
      - tmeet_pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    depends_on:
      - db

volumes:
  tmeet_pgdata:
